# ModCheck case list: new ModelicaTest coverage tests for Modelica.Electrical (branch coverage-improvement).
#
# Each case is one new test model, run unmodified on OpenModelica (see sources below).
# Variables are the comparison signals of the model, as listed in
# ModelicaTest/Resources/Reference/ModelicaTest/<Package>/<Model>/comparisonSignals.txt.
# ncp gives 500 output intervals per second of simulated time (2000 for long runs).
library: ModelicaTest
workspace: msl-coverage
custom_function: dynamic
tolerance: 0.001

# These cases cannot run on Modelon Impact (see the comment at each case), so they run on
# OpenModelica, which loads the libraries of this repository (MSL 4.2.0 dev). ModCheck runs
# one source per case list, hence this separate list next to the Impact one.
sources:
  default:
    backend: openmodelica
    omc: {via: local}
    solver: cvode
    # ModelicaTest pins Modelica 4.2.0 dev, which omc loads with loadModel(): put the
    # repository's Modelica, ModelicaServices and Complex on OPENMODELICALIBRARY as
    # 'Modelica 4.2.0 dev', 'ModelicaServices 4.2.0 dev' and 'Complex 4.2.0 dev.mo'
    # (directory junctions/symlinks to this repository).
    libraries: [../../../ModelicaTest/package.mo]

cases:
  - name: AnalogOpAmpLimited
    enabled: true
    model: ModelicaTest.Electrical.Analog.AnalogOpAmpLimited
    start_time: 0.0
    final_time: 0.04
    ncp: 500
    rtol: 1.0e-6
    # runs on OpenModelica: Analog.Ideal.OpAmpLimited is new in MSL 4.2 and not available in the MSL 4.1.0 of Modelon Impact
    modifiers: {}
    variables:
      - time
      - "opAmpLimited.out.v"
      - "opAmpFirstOrder.out.v"
  - name: MutualInductor
    enabled: true
    model: ModelicaTest.Electrical.QuasiStatic.Polyphase.MutualInductor
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    # runs on OpenModelica: OCT (Modelon Impact) crashes with a StackOverflowError on the Complex sum in QuasiStatic.Polyphase.Basic.MutualInductor of MSL 4.1.0; this repository has the fix (PR #4846), which OCT also compiles, but Impact runs its own MSL 4.1.0
    modifiers: {}
    variables:
      - time
      - "mutualInductor.i[[]1].re"
      - "mutualInductor.i[[]1].im"
      - "mutualInductor.i[[]2].re"
      - "load.v[[]3].im"
