# ModCheck case list: new ModelicaTest coverage tests for Modelica.Electrical (branch coverage-improvement).
#
# Each case is one new test model, run unmodified on Modelon Impact with the
# libraries of this repository (MSL 4.2.0 dev, see README.md).
# Variables are the comparison signals of the model, as listed in
# ModelicaTest/Resources/Reference/ModelicaTest/<Package>/<Model>/comparisonSignals.txt.
# ncp gives 500 output intervals per second of simulated time (2000 for long runs).
library: ModelicaTest
workspace: msl-coverage
custom_function: dynamic
tolerance: 0.001

cases:
  - name: AnalogSources
    enabled: true
    model: ModelicaTest.Electrical.Analog.AnalogSources
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    # the variable-frequency sources integrate their phase; at 100x rtol (1e-4) the phase error accumulates to 3 % of the sine outputs, so the check run is capped at 1e-5
    max_rtol: 1.0e-5
    modifiers: {}
    variables:
      - time
      - "R_cosineVoltage.v"
      - "R_exponentialsVoltage.v"
      - "R_expSineVoltage.v"
      - "R_lightningImpulseVoltage.v"
      - "R_pulseVoltage.v"
      - "R_sawToothVoltage.v"
      - "R_tableVoltage.v"
      - "R_trapezoidVoltage.v"
      - "R_cosineCurrent.v"
      - "R_exponentialsCurrent.v"
      - "R_expSineCurrent.v"
      - "R_lightningImpulseCurrent.v"
      - "R_pulseCurrent.v"
      - "R_sawToothCurrent.v"
      - "R_sineCurrent.v"
      - "R_stepCurrent.v"
      - "R_tableCurrent.v"
      - "R_trapezoidCurrent.v"
      - "R_sineVoltageVF.v"
      - "R_cosineVoltageVF.v"
      - "R_sineCurrentVF.v"
      - "R_cosineCurrentVF.v"
      - "R_supplyP.v"
      - "R_supplyN.v"
      - "variableLoad.v"
      - "variableLoad.i"
  - name: AnalogBasicComponents
    enabled: true
    model: ModelicaTest.Electrical.Analog.AnalogBasicComponents
    start_time: 0.0
    final_time: 0.1
    ncp: 500
    rtol: 1.0e-6
    # emf.i is sensitive to the integration error of the coupled EMF/inertia states at 100x rtol (1e-4); converges at 1e-5, so the check run is capped at 1e-5
    max_rtol: 1.0e-5
    modifiers: {}
    variables:
      - time
      - "R_vcv.v"
      - "R_vcc.v"
      - "R_ccv.v"
      - "R_ccc.v"
      - "variableCapacitor.i"
      - "variableInductor.i"
      - "variableConductor.i"
      - "R_secondary.v"
      - "opAmp.out.v"
      - "R_wiper.v"
      - "mass.s"
      - "emf.i"
