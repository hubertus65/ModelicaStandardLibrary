# ModCheck case list: new ModelicaTest coverage tests for Modelica.Completion (branch coverage-improvement).
#
# Each case is one new test model, run unmodified on OpenModelica (see sources below).
# Variables are the comparison signals of the model, as listed in
# ModelicaTest/Resources/Reference/ModelicaTest/<Package>/<Model>/comparisonSignals.txt.
# ncp gives 500 output intervals per second of simulated time (2000 for long runs).
library: ModelicaTest
workspace: msl-coverage
custom_function: dynamic
tolerance: 0.001

# These cases cannot run on Modelon Impact (see the comment at each case), so they run on
# OpenModelica, which loads the libraries of this repository (MSL 4.2.0 dev). ModCheck runs
# one source per case list, hence this separate list next to the Impact one.
sources:
  default:
    backend: openmodelica
    omc: {via: local}
    solver: cvode
    # ModelicaTest pins Modelica 4.2.0 dev, which omc loads with loadModel(): put the
    # repository's Modelica, ModelicaServices and Complex on OPENMODELICALIBRARY as
    # 'Modelica 4.2.0 dev', 'ModelicaServices 4.2.0 dev' and 'Complex 4.2.0 dev.mo'
    # (directory junctions/symlinks to this repository).
    libraries: [../../../ModelicaTest/package.mo]

cases:
  - name: UniversalConstraint_StiffSpring
    enabled: true
    model: ModelicaTest.MultiBody.UniversalConstraint_StiffSpring
    start_time: 0.0
    final_time: 10.0
    ncp: 2000
    rtol: 1.0e-6
    # runs on OpenModelica: OCT (Modelon Impact) does not keep the orientation of bodyOfConstraint consistent with the UniversalConstraint (also in the unmodified MSL example): at t = 1 s R.T[2,3] is 0.875 at rtol 1e-6 and 0.477 at 1e-8, OpenModelica gives 0.501 at both; see hubertus65/ModelicaStandardLibrary#6 (ImpactFailures.UniversalConstraintOrientationDrift)
    # on OpenModelica the angular velocity bodyOfConstraint.body.w_a of the body behind the constraint deviates by 1.6e-3 over 10 s at 100x rtol (1e-4), so the check run is capped at 1e-5
    max_rtol: 1.0e-5
    modifiers: {}
    variables:
      - time
      - "bodyOfConstraint.body.w_a[[]1]"
      - "bodyOfConstraint.body.w_a[[]2]"
      - "bodyOfConstraint.body.w_a[[]3]"
      - "joint.phi_a"
      - "joint.phi_b"
  - name: UniformNoiseXorshift64star_Clock10ms
    enabled: true
    model: ModelicaTest.Clocked.UniformNoiseXorshift64star_Clock10ms
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    # runs on OpenModelica: Modelon Impact's MSL has no Modelica.Clocked
    modifiers: {}
    variables:
      - time
      - "sample1.y"
      - "uniformNoiseXorshift64star.y"
