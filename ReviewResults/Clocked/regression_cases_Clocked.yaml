# ModCheck case list: new ModelicaTest coverage tests for Modelica.Clocked (branch coverage-improvement).
#
# Each case is one new test model, run unmodified on OpenModelica (see sources below).
# Variables are the comparison signals of the model, as listed in
# ModelicaTest/Resources/Reference/ModelicaTest/<Package>/<Model>/comparisonSignals.txt.
# ncp gives 500 output intervals per second of simulated time (2000 for long runs).
library: ModelicaTest
workspace: msl-coverage
custom_function: dynamic
tolerance: 0.001

# Modelica.Clocked is not part of the MSL distribution of Modelon Impact (OCT does not
# support clocked partitions), so these cases run on OpenModelica, which loads the
# libraries of this repository (MSL 4.2.0 dev) instead of MSL 4.1.0.
sources:
  default:
    backend: openmodelica
    omc: {via: local}
    solver: cvode
    # ModelicaTest pins Modelica 4.2.0 dev, which omc loads with loadModel(): put the
    # repository's Modelica, ModelicaServices and Complex on OPENMODELICALIBRARY as
    # 'Modelica 4.2.0 dev', 'ModelicaServices 4.2.0 dev' and 'Complex 4.2.0 dev.mo'
    # (directory junctions/symlinks to this repository).
    libraries: [../../ModelicaTest/package.mo]

cases:
  - name: RealSamplersAndHolds
    enabled: true
    model: ModelicaTest.Clocked.RealSamplersAndHolds
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    modifiers: {}
    variables:
      - time
      - "hold1.y"
      - "hold2.y"
      - "hold3.y"
      - "hold4.y"
      - "hold5.y"
      - "hold6.y"
      - "squareWave1.y"
      - "countTriggers.y"
      - "hold7.y"
      - "hold8.y"
      - "hold9.y"
      - "hold10.y"
      - "hold11.y"
      - "holdWithDAeffects1.y"
      - "hold12.y"
  - name: BooleanSamplersAndHolds
    enabled: true
    model: ModelicaTest.Clocked.BooleanSamplersAndHolds
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    modifiers: {}
    variables:
      - time
      - "hold1.y"
      - "hold2.y"
      - "hold3.y"
      - "hold4.y"
      - "hold5.y"
      - "hold6.y"
      - "countTriggers.y"
      - "hold7.y"
      - "hold8.y"
      - "hold9.y"
      - "hold10.y"
      - "hold11.y"
      - "countTicks.y"
      - "hold12.y"
      - "hold13.y"
      - "hold14.y"
      - "hold15.y"
  - name: IntegerSamplersAndHolds
    enabled: true
    model: ModelicaTest.Clocked.IntegerSamplersAndHolds
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    modifiers: {}
    variables:
      - time
      - "hold1.y"
      - "hold2.y"
      - "hold3.y"
      - "hold4.y"
      - "hold5.y"
      - "hold6.y"
      - "countTriggers.y"
      - "hold7.y"
      - "hold8.y"
      - "hold9.y"
      - "hold10.y"
      - "hold11.y"
      - "hold12.y"
      - "hold13.y"
  - name: RealClockedBlocksAndSources
    enabled: true
    model: ModelicaTest.Clocked.RealClockedBlocksAndSources
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    modifiers: {}
    variables:
      - time
      - "hold1.y"
      - "hold2.y"
      - "hold3.y"
      - "hold4.y"
      - "hold5.y"
      - "hold6.y"
      - "hold7.y"
      - "hold8.y"
      - "hold9.y"
      - "hold10.y"
      - "hold11.y"
      - "hold12.y"
      - "hold13.y"
  - name: Clocks
    enabled: true
    model: ModelicaTest.Clocked.Clocks
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    modifiers: {}
    variables:
      - time
      - "lastTick_periodicExactClock1.y"
      - "lastTick_periodicExactClock2.y"
      - "lastTick_eventClock1.y"
      - "lastTick_conjunctiveClock1.y"
      - "lastTick_disjunctiveClock1.y"
      - "lastTick_subSampleClock1.y"
      - "lastTick_superSampleClock1.y"
      - "lastTick_shiftSampleClock1.y"
      - "lastTick_rotationalClock1.y"
      - "lastTick_fixedRotationalClock1.y"
      - "rotationalClock1.direction"
      - "fixedRotationalClock1.direction"
  - name: AssignClockToSquareWaveHold
    # disabled: OpenModelica 1.27.1 assigns the default clock (1 s) to the Integer and Boolean AssignClockToSquareWaveHold instead of the clock of their input
    enabled: false
    model: ModelicaTest.Clocked.AssignClockToSquareWaveHold
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    modifiers: {}
    variables:
      - time
      - "squareWaveInteger.y"
      - "squareWaveBoolean.y"
