# ModCheck case list: new ModelicaTest coverage tests for Modelica.Media (branch coverage-improvement).
#
# Each case is one new test model, run unmodified on Modelon Impact with the
# libraries of this repository (MSL 4.2.0 dev, see README.md). Variables are the comparison signals of the model, as listed in
# ModelicaTest/Resources/Reference/ModelicaTest/<Package>/<Model>/comparisonSignals.txt.
# ncp gives 500 output intervals per second of simulated time (2000 for long runs).
library: ModelicaTest
workspace: msl-coverage
custom_function: dynamic
tolerance: 0.001

cases:
  - name: MediaCommonFunctions
    enabled: true
    model: ModelicaTest.Media.MediaCommonFunctions
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    modifiers: {}
    variables:
      - time
      - "v"
      - "vError"
      - "cpError"
      - "alpha"
      - "gamma"
      - "p3"
      - "s3"
      - "boundaryDiff"
      - "cv2ph"
      - "dpT"
      - "dpTRelDiff"
      - "pro_ph.d"
      - "pro_ph.ddhp"
      - "pro_ph.duph"
      - "pro_dT.p"
      - "pro_dT.dpT"
      - "nderivs_ph.cp"
      - "nderivs_dT.vp"
      - "nderivs_ps.cp"
      - "satBoundary.dTp"
      - "twoPhaseTransport.eta_liq"
      - "igProps.R_s[[]1]"
      - "transport.lam"
