# ModCheck case list: new ModelicaTest coverage tests for Modelica.ComplexBlocks (branch coverage-improvement).
#
# Each case is one new test model, run unmodified on OpenModelica (see sources below).
# Variables are the comparison signals of the model, as listed in
# ModelicaTest/Resources/Reference/ModelicaTest/<Package>/<Model>/comparisonSignals.txt.
# ncp gives 500 output intervals per second of simulated time (2000 for long runs).
library: ModelicaTest
workspace: msl-coverage
custom_function: dynamic
tolerance: 0.001

# These cases cannot run on Modelon Impact (see the comment at each case), so they run on
# OpenModelica, which loads the libraries of this repository (MSL 4.2.0 dev). ModCheck runs
# one source per case list, hence this separate list next to the Impact one.
sources:
  default:
    backend: openmodelica
    omc: {via: local}
    solver: cvode
    # ModelicaTest pins Modelica 4.2.0 dev, which omc loads with loadModel(): put the
    # repository's Modelica, ModelicaServices and Complex on OPENMODELICALIBRARY as
    # 'Modelica 4.2.0 dev', 'ModelicaServices 4.2.0 dev' and 'Complex 4.2.0 dev.mo'
    # (directory junctions/symlinks to this repository).
    libraries: [../../../ModelicaTest/package.mo]

cases:
  - name: ComplexStep
    enabled: true
    model: ModelicaTest.ComplexBlocks.ComplexStep
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    # runs on OpenModelica: OCT (Modelon Impact) fails to compile Sources.ComplexStep of MSL 4.1.0 (generated C code contains the record constructor ComplexOutput); this repository has the fix (PR #4847), which OCT also compiles, but Impact runs its own MSL 4.1.0
    modifiers: {}
    variables:
      - time
      - "complexStep1.y.re"
      - "complexStep1.y.im"
      - "complexPassThrough1.y.re"
      - "complexPassThrough1.y.im"
  - name: ComplexMathConjugateIfExpressions
    enabled: true
    model: ModelicaTest.ComplexBlocks.ComplexMathConjugateIfExpressions
    start_time: 0.0
    final_time: 1.0
    ncp: 500
    rtol: 1.0e-6
    # runs on OpenModelica: OCT (Modelon Impact) fails to compile the inline Complex if-expressions of ComplexMath Feedback/Gain/Division/Add3 in MSL 4.1.0; this repository has the fix (PR #4847), which OCT also compiles, but Impact runs its own MSL 4.1.0
    modifiers: {}
    variables:
      - time
      - "feedback1.y.re"
      - "feedback1.y.im"
      - "feedback2.y.re"
      - "feedback2.y.im"
      - "gain1.y.re"
      - "gain1.y.im"
      - "gain2.y.re"
      - "gain2.y.im"
      - "division1.y.re"
      - "division1.y.im"
      - "division2.y.re"
      - "division2.y.im"
      - "add3Default.y.re"
      - "add3Default.y.im"
      - "add3Conjugate.y.re"
      - "add3Conjugate.y.im"
